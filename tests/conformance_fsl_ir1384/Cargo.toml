[package]
name = "ir1384-fsl-receipt"
version = "0.0.0"
edition = "2021"
publish = false
description = "FR-361 explicit lane: a genuine FSL tick-monitor plan and its admitted authority bind through IR's selected closure."

# A standalone package: the cycle-free model crate takes no FSL dependency, and
# the ordinary workspace gate never builds this lane. Run `make conformance-fsl-ir1384`.
[workspace]

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
filament-contract-model = { path = "../../crates/filament-contract-model" }
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "743c42e4e458782bf7a8befc3b76cc8a190ed727" }
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.2" }
filament-observation = { git = "https://github.com/agent-ix/filament-observation", rev = "a571be6adc71d4a53d44f62fb867c7b50f271a16" }
serde_json = "1"
fsl-analyze = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
fsl-foundation = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
fsl-replay = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }
fsl-semantics = { git = "https://github.com/agent-ix/filament-spec-language", branch = "main" }

# The producer and the consumer must share this checkout's model crate.
[patch."https://github.com/agent-ix/filament-contract-ir"]
filament-contract-model = { path = "../../crates/filament-contract-model" }

[[test]]
name = "receipt"
path = "tests/receipt.rs"

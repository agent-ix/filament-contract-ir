[workspace]
members = [".", "crates/filament-contract-model"]
resolver = "2"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "filament-contract-ir"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.1"
description = "Versioned semantic contract model and canonical representation for assurance tooling."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/filament-contract-ir"

[lints]
workspace = true

[lib]
name = "filament_contract_ir"
path = "src/lib.rs"

[[bin]]
name = "filament-contract-conformance"
path = "src/bin/filament-contract-conformance.rs"
required-features = ["conformance-cli"]

[features]
default = []
conformance-cli = ["dep:ix-cli-kit"]
test-support = ["filament-contract-model/test-support"]

# FR-038-AC-107: reads FSpec's positive fixtures from a `filament-specification`
# checkout, which `make test` has not got. `test = false` keeps it outside
# `cargo test --workspace --all-targets`; CI compiles it with `--no-run`, and
# only `make conformance-fspec` runs its fixture tests.
[[test]]
name = "conformance_fspec"
path = "tests/conformance_fspec/main.rs"
test = false

# FR-355/TC-464: exact live FSL producer output and its selected model are
# caller inputs to this explicit conformance lane, outside the ordinary gate.
[[test]]
name = "conformance_fsl_ir1236"
path = "tests/conformance_fsl_ir1236/main.rs"
test = false

# FR-049/TC-447: fresh FSL source is compiled by the owning checkout's
# executable in a named producer lane, outside ordinary IR make test.
[[test]]
name = "conformance_fsl_ir769"
path = "tests/conformance_fsl_ir769/main.rs"
test = false

# FR-352-AC-9: the real FSL selected-identity producer is an explicit host lane.
[[test]]
name = "conformance_fsl_exact_producer"
path = "tests/conformance_fsl_exact_producer/main.rs"
test = false

# FR-050/TC-450: independently read FSL's checked RequirementItem path
# conditions before mapping the FR-062 RR-13 guards into admitted IR.
[[test]]
name = "conformance_fsl_ir779"
path = "tests/conformance_fsl_ir779/main.rs"
test = false

# FR-053/TC-453: the selected-population fixture is emitted by the owning
# FSL checkout, so its test runs only in the named conformance lane.
[[test]]
name = "conformance_fsl_ir760"
path = "tests/conformance_fsl_ir760/main.rs"
test = false

# FR-067-AC-7: read fresh FSL producer output in a named external lane.
[[test]]
name = "conformance_fsl_ir1052"
path = "tests/conformance_fsl_ir1052.rs"
test = false

# FR-038-AC-214: 177 MB fixture and three isolated reader processes.
# Explicitly invoked for the memory gate, excluded from ordinary `make test`.
[[test]]
name = "ir575_reader_memory"
path = "tests/ir575_reader_memory.rs"
test = false

# TC-019: CI invokes capture once per supported OS and compares the three
# resulting artifacts in a named job outside the ordinary local test lane.
[[test]]
name = "tc019_determinism"
path = "tests/tc019_determinism.rs"
test = false
harness = false

# Explicit compiler-observed entry-census controls; deliberate bypasses must
# fail the external census, so they do not belong to the ordinary test gate.
[[test]]
name = "read_entry_census_controls"
path = "tests/read_entry_census_controls.rs"
test = false

[dependencies]
ix-cli-kit = { version = "0.1", git = "https://github.com/agent-ix/ix-cli-kit", tag = "v0.1.0", default-features = false, optional = true }
ix-trace-rs = { version = "0.1", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
filament-contract-model = { version = "=0.1.1", path = "crates/filament-contract-model" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
thiserror = "=2.0.20"

[dev-dependencies]
allocation-counter = "0.8"
# Native Filament consumer qualification stays outside the cycle-free model.
quire-rs = { version = "0.53", git = "https://github.com/agent-ix/quire-rs", tag = "v0.53.0", default-features = false }
syn = { version = "2", features = ["full", "visit"] }
filament-contract-model = { version = "=0.1.1", path = "crates/filament-contract-model", features = ["fault-injection"] }
# First-party dependencies use release tags; Cargo.lock records the immutable commits.
quire-canonical = { version = "0.3", git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.1" }
filament-exact = { version = "0.2", git = "https://github.com/agent-ix/filament-exact", tag = "v0.2.0" }
filament-verification-contracts = { version = "0.1", git = "https://github.com/agent-ix/filament-verification-contracts", tag = "v0.1.1" }
jsonschema = { version = "=0.17.1", default-features = false, features = ["draft202012"] }
sha2 = "=0.10.9"


[profile.release]
lto = "thin"
codegen-units = 1
